name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: helm-core/go.sum

      - name: Download dependencies
        working-directory: helm-core
        run: go mod download

      - name: Verify dependencies
        working-directory: helm-core
        run: go mod verify

      - name: Build
        working-directory: helm-core
        run: go build -v ./...

      - name: Vet
        working-directory: helm-core
        run: go vet ./...
