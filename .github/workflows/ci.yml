name: CI & Snapshot Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Snapshot Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: helm-core

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'helm-core/go.mod'
          cache-dependency-path: 'helm-core/go.sum'

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Test
        run: go test -v ./...

      - name: Build Linux amd64 Binary
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/helm-core-linux-amd64 ./cmd/helm

      - name: Build Linux arm64 Binary
        run: GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/helm-core-linux-arm64 ./cmd/helm

      - name: Create or Update GitHub Snapshot Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "helm-core/dist/*"
          body: "Automated snapshot release of helm-core built from branch ${{ github.ref_name }}."
          name: "Snapshot Release"
          tag: "snapshot"
          prerelease: true
